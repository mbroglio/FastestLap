name: SonarQube Cloud

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Java sources
        run: ./gradlew compileDebugJavaWithJavac --no-configuration-cache

      - name: Run Android Lint
        continue-on-error: true
        run: ./gradlew lintDebug --no-configuration-cache

      - name: Run unit tests and coverage report
        continue-on-error: true
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport --no-configuration-cache

      - name: Analyze with SonarQube Cloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Missing SONAR_TOKEN repository secret."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew sonar --no-configuration-cache
          else
            ./gradlew sonar --no-configuration-cache -Dsonar.branch.name="${{ github.ref_name }}"
          fi
