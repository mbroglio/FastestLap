name: SonarQube Cloud

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Java sources
        run: ./gradlew compileDebugJavaWithJavac --no-configuration-cache --build-cache --parallel

      - name: Run Android Lint, unit tests, and coverage report
        run: ./gradlew lintDebug testDebugUnitTest createDebugUnitTestCoverageReport --no-configuration-cache --build-cache --parallel --continue || true

      - name: Analyze with SonarQube Cloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Missing SONAR_TOKEN repository secret."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew sonar --no-configuration-cache --build-cache \
              -Dsonar.projectVersion="run-${{ github.run_number }}" \
              -Dsonar.exclusions="**/*.mp4,**/*.mp3,Screenshots/**"
          else
            ./gradlew sonar --no-configuration-cache --build-cache \
              -Dsonar.projectVersion="run-${{ github.run_number }}" \
              -Dsonar.exclusions="**/*.mp4,**/*.mp3,Screenshots/**" \
              -Dsonar.branch.name="${{ github.ref_name }}"
          fi
